name: Validate eggs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate egg catalog
        run: python tools/validate_eggs.py

      - name: Validate Dockerfiles parse
        run: |
          for dockerfile in images/*/Dockerfile; do
            echo "Checking $dockerfile"
            grep -q "^FROM " "$dockerfile" || { echo "No FROM in $dockerfile"; exit 1; }
          done
